# ===================================================================
# Server Configuration (Vercel assigns $PORT dynamically, fallback to 8081)
# ===================================================================
server.port=${PORT:8081}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ===================================================================
# Spring Application Configuration
# ===================================================================
spring.application.name=yovexa-solutions-backend
spring.mvc.servlet.load-on-startup=1

# ===================================================================
# MongoDB Database Configuration
# ===================================================================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/yovexa_solutions}
spring.data.mongodb.database=${MONGODB_DATABASE:yovexa_admin}
spring.data.mongodb.auto-index-creation=${AUTO_INDEX_CREATION:false}

# ===================================================================
# Multipart File Upload Configuration
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ===================================================================
# Application Custom Security & JWT Configuration
# ===================================================================
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:${JWT_EXPIRATION_MS:900000}}
app.jwt.secret=${jwt.secret}
app.jwt.expiration-ms=${jwt.expiration}
jwt.refresh.expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}
jwt.refresh.grace-period-seconds=${JWT_REFRESH_GRACE_PERIOD_SECONDS:15}
jwt.cookie.secure=${JWT_COOKIE_SECURE:false}
jwt.cookie.same-site=${JWT_COOKIE_SAME_SITE:Lax}

# ===================================================================
# CORS Configuration
# ===================================================================
frontend.url=${FRONTEND_URL:https://yovexa-solutions1.vercel.app}
frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:https://yovexa-solutions1.vercel.app,https://yovexa-solutions-backend1.vercel.app,http://localhost:5173,http://localhost:5174}
app.cors.allowed-origins=${frontend.allowed-origins}


# ===================================================================
# Mail & SMTP Configuration (Google / Gmail SMTP)
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===================================================================
# OpenAPI Swagger Documentation Configuration
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.root=INFO
logging.level.com.yovexa.solutions=${LOGGING_LEVEL_APP:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb.core.MongoTemplate=${LOGGING_LEVEL_MONGO:WARN}

# ===================================================================
# Redis & Cache Configuration
# ===================================================================
spring.data.redis.url=${REDIS_URL:}
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=200ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.shutdown-timeout=100ms
